<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Your Career Assessment | Career Craft Youth</title>
<meta name="description" content="Begin your psychometric career assessment with Career Craft Youth.">
<meta name="robots" content="index, follow">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f5f0; color: #1f2a44; }
  header { background: #1f2a44; padding: 16px 24px; }
  header a { color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 32px; margin-bottom: 24px; }

  /* TU Careers widget (#tu-widget) — real ids captured from the live rendered DOM */
  #tu-widget {
    max-width: 420px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e6e2d8;
    border-radius: 12px;
    padding: 32px 28px;
    box-shadow: 0 4px 20px rgba(31, 42, 68, 0.08);
  }
  #tu-widget form { display: flex; flex-direction: column; }
  #tu-widget #tu-test-code-wrapper,
  #tu-widget #tu-email-wrapper,
  #tu-widget #tu-reemail-wrapper {
    margin-bottom: 20px;
  }
  #tu-widget label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #6b6459;
    margin-bottom: 8px;
  }
  #tu-widget input[type="text"] {
    box-sizing: border-box;
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    color: #1f2a44;
    background: #fbfaf7;
    border: 1px solid #dcd6c8;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #tu-widget input[type="text"]:focus {
    border-color: #c99a3e;
    box-shadow: 0 0 0 3px rgba(201, 154, 62, 0.18);
  }
  #tu-widget #tu-already-form-error,
  #tu-widget #start-test-errors,
  #tu-widget #test-code-description,
  #tu-widget #email-description,
  #tu-widget #reemail-description {
    font-size: 13px;
    color: #c0392b;
    margin-top: 6px;
  }
  #tu-widget #tu-already-form-error:empty,
  #tu-widget #start-test-errors:empty,
  #tu-widget #test-code-description:empty,
  #tu-widget #email-description:empty,
  #tu-widget #reemail-description:empty {
    display: none;
  }
  #tu-widget #tu-submit-wrapper { margin-top: 8px; }
  #tu-widget #start-form-submit {
    width: 100%;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    color: #1f2a44;
    background: linear-gradient(135deg, #e4c576, #c99a3e);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
  }
  #tu-widget #start-form-submit:hover { opacity: 0.92; transform: translateY(-1px); }

  .no-code-note {
    max-width: 420px;
    margin: 16px auto 0;
    text-align: center;
    font-size: 14px;
    color: #6b6459;
  }
  .no-code-note a { color: #c99a3e; font-weight: 600; text-decoration: none; }
  .no-code-note a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header><a href="https://careercraftyouth.in/">&larr; Home</a></header>
<main>
<h1>Start your career assessment.</h1>

<script src="https://beacon.tucareers.com/sites/all/modules/assessment_widget/js/assessment_widget.js"></script>
<div id="tu-widget"></div>
<script>TuWidget({
"start_form_div":"tu-widget",
"manager":"TUB0468",
"data_inquiry_show":0,
"data_inquiry_pop_up":0,
"data_free_show":0,
"data_free_pop_up":0,
"inquiry_form_div":"",
"start_form_css":{},
"inquiry_form_css":{},
"free_form_div": "",
"free_form_css":{},
"primary_assessment": ""
});</script>
<p class="no-code-note">Don't have code? Connect with us by <a href="https://careercraftyouth.in/#contact">Booking the discovery call</a></p>
</main>
</body>
</html>
